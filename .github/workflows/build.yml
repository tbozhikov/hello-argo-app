name: Build and Publish
on:
  push:
    branches: [ "main" ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v3
    - name: Log in to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
    - name: Checkout config repo
      uses: actions/checkout@v3
      with:
        repository: ${{ github.repository_owner }}/hello-argo-config
        token: ${{ secrets.CONFIG_REPO_TOKEN }}
        path: config
    - name: Update image tag and push
      working-directory: config
      run: |
        sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" deployment.yaml
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add deployment.yaml
        git commit -m "Update hello-argo-app image to ${{ github.sha }}"
        git push
